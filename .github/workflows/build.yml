name: Build image

on:
  push:
    branches: [main]
    paths:
      - upstream.json
      - patches/**
      - overlay/**
      - scripts/prepare-source.py
  # Workflow-only changes are verified by the PR build; publish manually if needed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Each architecture builds natively; emulating the Parabol build under QEMU takes hours.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Test and prepare build context
        run: |
          scripts/test.sh
          python3 scripts/prepare-source.py --output .context
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parabol" >> "$GITHUB_ENV"

      - name: Free disk space for the Parabol build
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .context
          file: .context/docker/selfhost/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag multi-arch image and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parabol"
          tag=$(jq -r .tag upstream.json)
          docker buildx imagetools create -t "$image:$tag" -t "$image:latest" \
            $(cd "$RUNNER_TEMP/digests" && printf "$image@sha256:%s " *)
          # Rebuilds of an already released upstream version only refresh the image tags.
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" --target "$GITHUB_SHA" --title "Parabol $tag" --notes "\`\`\`
          docker pull $image:$tag
          \`\`\`

          Upstream release notes: https://github.com/ParabolInc/parabol/releases/tag/$tag"
