name: Build image

on:
  push:
    branches: [main]
    paths:
      - upstream.json
      - patches/**
      - overlay/**
      - scripts/prepare-source.py
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Each architecture builds natively; emulating the Parabol build under QEMU takes hours.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test and prepare build context
        run: |
          scripts/test.sh
          python3 scripts/prepare-source.py --output .context
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parabol" >> "$GITHUB_ENV"

      - name: Free disk space for the Parabol build
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .context
          file: .context/docker/selfhost/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag multi-arch image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parabol"
          tag=$(jq -r .tag upstream.json)
          docker buildx imagetools create -t "$image:$tag" -t "$image:latest" \
            $(cd "$RUNNER_TEMP/digests" && printf "$image@sha256:%s " *)
